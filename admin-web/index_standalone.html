<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面管理端 - 建筑工程项目多智能体管理平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <span class="brand-badge">M</span>
          <div>
            <p class="brand-eyebrow">Marvis</p>
            <h1>工程智能体平台</h1>
          </div>
        </div>

        <section class="context-card" id="project-context-card"></section>

        <nav class="nav-list">
          <p class="nav-group">对话</p>
          <button class="nav-item active" data-view="agents">
            <span class="nav-main"><span class="nav-icon">💬</span><span>智能问答</span></span>
          </button>
          <p class="nav-group">专业智能体</p>
          <button class="nav-item" data-view="schedule">
            <span class="nav-main"><span class="nav-icon">📅</span><span>进度管理</span></span>
            <span class="online-dot"></span>
          </button>
          <button class="nav-item" data-view="quality">
            <span class="nav-main"><span class="nav-icon">🔍</span><span>质量管理</span></span>
            <span class="online-dot"></span>
          </button>
          <button class="nav-item" data-view="cost">
            <span class="nav-main"><span class="nav-icon">💰</span><span>成本管理</span></span>
            <span class="online-dot"></span>
          </button>
          <button class="nav-item" data-view="safety">
            <span class="nav-main"><span class="nav-icon">🛡️</span><span>安全管理</span></span>
            <span class="nav-count">3</span>
            <span class="online-dot"></span>
          </button>
          <button class="nav-item" data-view="documents">
            <span class="nav-main"><span class="nav-icon">📄</span><span>资料管理</span></span>
            <span class="online-dot"></span>
          </button>
          <p class="nav-group">功能</p>
          <button class="nav-item" data-view="dashboard">
            <span class="nav-main"><span class="nav-icon">📊</span><span>仪表盘</span></span>
          </button>
          <button class="nav-item" data-view="roadmap">
            <span class="nav-main"><span class="nav-icon">🧭</span><span>建设规划</span></span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <p>现场端 / 公司层预留</p>
          <a href="/field-h5/">打开 H5 巡检入口</a>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="scope-label" id="scope-label">项目层视图</p>
            <div class="title-line">
              <h2 id="page-title">智能问答</h2>
              <span class="version-pill">v1.0 Alpha</span>
            </div>
          </div>

          <div class="topbar-controls">
            <button id="refresh-button">刷新数据</button>
          </div>
        </header>

        <section class="headline-strip" id="headline-strip"></section>

        <div class="workspace-grid">
          <section class="primary-column" id="view-root"></section>

          <aside class="side-rail">
            <article class="rail-panel">
              <div class="rail-header">
                <h3>Agent 结论记录</h3>
              </div>
              <div id="insight-list"></div>
            </article>

            <article class="rail-panel">
              <div class="rail-header">
                <h3>消息中心</h3>
                <span id="notification-count">0</span>
              </div>
              <div id="notification-list"></div>
            </article>

            <article class="rail-panel">
              <div class="rail-header">
                <h3>审计日志</h3>
                <span id="audit-count">0</span>
              </div>
              <div id="audit-list"></div>
            </article>

            <article class="rail-panel">
              <div class="rail-header">
                <h3>Agent 编排</h3>
                <span>6 个内置角色</span>
              </div>
              <div id="agent-catalog"></div>
            </article>
          </aside>
        </div>
      </main>
    </div>

    <aside class="assistant-dock" id="assistant-dock" aria-label="项目智能体对话窗口">
      <button class="assistant-launcher" id="assistant-launcher" type="button">
        <span>AI</span>
        <strong>项目智能体</strong>
      </button>

      <section class="assistant-window open" id="assistant-window">
        <header class="assistant-header">
          <div class="assistant-identity">
            <span class="assistant-avatar">AI</span>
            <div>
              <p>Project Copilot</p>
              <h3>项目智能体</h3>
            </div>
          </div>
          <button id="assistant-minimize" type="button" aria-label="收起项目智能体">收起</button>
        </header>

        <div class="assistant-context" id="assistant-context"></div>
        <div class="assistant-suggestions" id="assistant-suggestions"></div>
        <div class="assistant-thread" id="assistant-thread"></div>

        <form class="assistant-input-row" id="assistant-form">
          <input id="assistant-input" placeholder="问项目进度、质量、成本、安全、资料..." />
          <button type="submit">发送</button>
        </form>
      </section>
    </aside>

    <script src="./app.js?v=evidence-tabs"></script>
  </body>
</html>
